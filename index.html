<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0f1c">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>רצים בראש שקט</title>
<style>
:root{--bg:#0a0f1c;--card:#151f33;--card2:#1c2942;--line:#273656;--ink:#f1f5fb;--mut:#a3b0c8;
--acc:#c5f43b;--acc-ink:#0a0f1c;--run:#d9480f;--walk:#0b7fab;--warmup:#b45309;--cooldown:#6d28d9;
--up:#86efac;--down:#fca5a5;--warn:#3b2f0b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{margin:0;background:var(--bg)}
body{color:var(--ink);font:18px/1.45 system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
h1{font-size:2rem;font-weight:900;margin:0;letter-spacing:-.5px;line-height:1.1}
h2{font-size:1.05rem;font-weight:800;margin:0 0 10px}
p{margin:0 0 8px}
.mut{color:var(--mut);font-size:.9rem}
.hero{position:relative;overflow:hidden;border-radius:22px;padding:20px 18px;margin-bottom:14px;
background:linear-gradient(135deg,#1c2942 0%,#0f1830 70%);border:1px solid var(--line)}
.hero:before{content:"";position:absolute;inset-block:0;inset-inline-end:-40px;width:120px;background:var(--acc);transform:skewX(-18deg);opacity:.9}
.hero>*{position:relative;max-width:78%}
.kick{color:var(--acc);font-weight:800;font-size:.85rem;letter-spacing:.5px;margin-bottom:2px}
.hero p{color:var(--mut);margin-top:6px;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
label,.lbl{display:block;font-weight:700;margin:10px 0 4px;font-size:.95rem}
input{width:100%;font:inherit;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:#0d1526;color:var(--ink)}
input:focus,button:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button,.btn{font:inherit;font-weight:800;border:0;border-radius:14px;padding:14px 18px;min-height:52px;cursor:pointer;
background:var(--acc);color:var(--acc-ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;text-align:center}
button:active,.btn:active{filter:brightness(.9)}
.sec{background:var(--card2);color:var(--ink);border:1px solid var(--line)}
.wa{background:#22c55e;color:#04210f}
.dng{background:transparent;color:var(--down);border:1px solid #5b2b2b}
.cta{width:100%;min-height:64px;font-size:1.3rem;margin-top:6px}
.lnk{background:none;color:var(--mut);text-decoration:underline;min-height:40px;font-weight:500;border:0}
.stack{display:grid;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:8px 14px;background:var(--card2);color:var(--ink);border:1px solid var(--line);border-radius:999px;font-weight:600;font-size:.9rem}
.err{color:var(--down);font-size:.9rem;min-height:1.2em}
select{width:100%;font:inherit;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:#0d1526;color:var(--ink)}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
/* stepper */
.stp{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0}
.stp+.stp{border-top:1px solid var(--line)}
.stp-l{font-weight:700}
.stp-c{display:flex;align-items:center;gap:10px}
.stp-c button{width:52px;height:52px;min-height:0;padding:0;border-radius:50%;font-size:1.6rem;background:var(--card2);color:var(--acc);border:1px solid var(--line)}
.stp-c output{min-width:76px;text-align:center;font-size:1.5rem;font-weight:900;font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-inline-end:8px}
.d-run{background:var(--run)}.d-walk{background:var(--walk)}.d-warmup{background:var(--warmup)}.d-cooldown{background:var(--cooldown)}
.blk-h{display:flex;justify-content:space-between;align-items:center}
.swg{display:flex;align-items:center;gap:10px}
.swl{font-weight:800;font-size:.9rem;color:var(--mut);min-width:3.2em;text-align:end}
.swl.on{color:var(--acc)}
.sw{width:56px;height:32px;min-height:0;padding:0;border-radius:999px;background:var(--card2);border:1px solid var(--line);position:relative;flex:none}
.sw:after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:var(--mut);transition:inset-inline-start .15s,background .15s}
.sw[aria-checked=true]{background:var(--acc)}
.sw[aria-checked=true]:after{inset-inline-start:27px;background:var(--acc-ink)}
.rm{background:none;color:var(--down);min-height:36px;padding:4px 8px;font-size:.9rem;font-weight:600}
.total{display:flex;justify-content:space-between;align-items:baseline;font-weight:800}
.total b{font-size:1.6rem;color:var(--acc);font-variant-numeric:tabular-nums}
.note{background:var(--warn);border:1px solid #6b5514;border-radius:12px;padding:12px;margin:12px 0;font-size:.95rem}
ul.plan{list-style:none;padding:0;margin:0}
ul.plan li{padding:10px 0;border-bottom:1px solid var(--line);display:flex;align-items:center}
ul.plan li:last-child{border:0}
/* tabs */
.tabs{position:fixed;bottom:0;inset-inline:0;display:flex;background:#0d1526;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tabs button{flex:1;background:none;color:var(--mut);border-radius:0;min-height:62px;flex-direction:column;gap:2px;font-size:.8rem;font-weight:700;position:relative}
.tabs button span{font-size:1.4rem;line-height:1}
.tabs button[aria-current]{color:var(--acc)}
.tabs button[aria-current]:before{content:"";position:absolute;top:0;width:40px;height:4px;background:var(--acc);border-radius:0 0 4px 4px}
/* log */
.log{display:block;width:100%;text-align:start;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0;font-weight:500}
.log b{display:block;font-size:1.05rem}
.log .m{color:var(--mut);font-size:.9rem;margin-top:4px}
.log .k{color:var(--acc);font-weight:800}
/* session */
.ses{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;
padding:max(16px,env(safe-area-inset-top)) 20px max(16px,env(safe-area-inset-bottom));text-align:center;transition:background .3s;z-index:10}
.ph-run{background:var(--run)}.ph-walk{background:var(--walk)}.ph-warmup{background:var(--warmup)}.ph-cooldown{background:var(--cooldown)}
.ses,.ses *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.ses .top{position:absolute;top:max(12px,env(safe-area-inset-top));inset-inline:16px;display:flex;justify-content:space-between;font-size:.9rem}
.phase{font-size:2.6rem;font-weight:900}
.rep{font-size:1.2rem;min-height:1.6em}
.cd{font-size:6.5rem;font-weight:900;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-2px}
.pbar{width:100%;max-width:420px;height:12px;background:rgba(255,255,255,.3);border-radius:8px;overflow:hidden}
.pbar i{display:block;height:100%;background:#fff;width:0;border-radius:8px}
.ctl{display:flex;gap:12px;margin-top:10px;width:100%;max-width:420px}
.ctl button{flex:1;background:rgba(255,255,255,.22);color:#fff;border:2px solid rgba(255,255,255,.7);min-height:60px;font-size:1.1rem}
.ses .lnk{color:#fff}
/* summary & stats */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.tile b{display:block;font-size:1.7rem;color:var(--acc);font-variant-numeric:tabular-nums;font-weight:900}
.tile span{font-size:.85rem;color:var(--mut)}
.tile small{display:block;font-size:.8rem;font-weight:700;min-height:1.2em}
.up{color:var(--up)}.down{color:var(--down)}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th,td{padding:8px 4px;text-align:center;border-bottom:1px solid var(--line)}
th{font-size:.8rem;color:var(--mut);font-weight:600}
td:first-child,th:first-child{text-align:start}
td input{width:76px;padding:6px;text-align:center}
.big{font-size:3rem;text-align:center}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;min-height:44px;background:none;color:var(--mut)}
.seg button[aria-pressed=true]{background:var(--acc);color:var(--acc-ink)}
.nav{display:flex;align-items:center;justify-content:space-between;margin:12px 0}
.nav button{width:48px;min-height:48px;padding:0;background:var(--card2);color:var(--ink);border:1px solid var(--line)}
.nav button:disabled{opacity:.3}
.nav b{font-size:1.05rem}
.bars{display:flex;gap:6px;align-items:flex-end;height:150px;padding-top:18px}
.bar-c{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px;min-width:0}
.bar-c .bf{width:100%;max-width:34px;background:var(--acc);border-radius:6px 6px 0 0}
.bar-c .bf.z{background:var(--line)}
.bar-c .bv{font-size:.7rem;color:var(--mut);min-height:1em}
.bar-c .bl{font-size:.8rem;color:var(--mut)}
.map{height:300px;border-radius:14px;overflow:hidden;background:#0d1526;direction:ltr}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:.85rem;color:var(--mut)}
.legend i{display:inline-block;width:18px;height:6px;border-radius:3px;margin-inline-end:6px;vertical-align:middle}
tr[data-seg]:focus-visible{outline:3px solid var(--acc)}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.8rem;font-weight:800;border:1.5px solid}
.b-none{color:#fca5a5;border-color:#7f3434;background:#2b1517}
.b-part{color:#fcd34d;border-color:#7a6118;background:#2b2210}
.b-done{color:#86efac;border-color:#2f6b45;background:#12261a}
.b-over{color:#7dd3fc;border-color:#2b5f7a;background:#10222c}
.b-plan{color:var(--acc);border-color:#5c7a1f;background:#1b2410}
.chip[aria-pressed=true]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:6px}
.mg .wd{text-align:center;font-size:.75rem;color:var(--mut);padding:4px 0}
.mg .blank{min-height:48px}
.mg button.day{min-height:48px;padding:2px 0;border-radius:12px;background:var(--card2);color:var(--ink);border:1.5px solid transparent;font-weight:700;font-size:.95rem;flex-direction:column;gap:3px}
.mg button.day.today{border-color:var(--acc)}
.mg button.day.sel{background:#2a3b5e;border-color:var(--mut)}
.dots{display:flex;gap:3px;height:8px;justify-content:center}
.dt{display:inline-block;width:8px;height:8px;border-radius:50%;box-sizing:border-box}
.dt.plan{border:2px solid var(--acc)}
.dt.missed{border:2px solid #fca5a5}
.dt.done{background:#86efac}.dt.part{background:#fcd34d}.dt.none{background:#fca5a5}.dt.free{background:var(--mut)}
.legend .dt{margin-inline-end:6px;vertical-align:middle}
.fb{list-style:none;padding:0;margin:0}
.fb li{padding:8px 0;border-bottom:1px solid var(--line)}
.fb li:last-child{border:0}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = s => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const fmtH = s => { s = Math.round(s); const h = Math.floor(s / 3600); return h ? h + ':' + String(Math.floor(s % 3600 / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0') : fmt(s); };
const km2 = m => (m / 1000).toFixed(2);
const pace = (sec, m) => (m >= 20 && sec > 0) ? fmt(sec / (m / 1000)) : '—';
const paceSec = (sec, m) => m >= 100 && sec > 0 ? sec / (m / 1000) : null;
const enc = o => { const b = new TextEncoder().encode(JSON.stringify(o)); let s = ''; b.forEach(c => s += String.fromCharCode(c)); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
const dec = t => { t = t.replace(/-/g, '+').replace(/_/g, '/'); while (t.length % 4) t += '='; const s = atob(t); return JSON.parse(new TextDecoder().decode(Uint8Array.from(s, c => c.charCodeAt(0)))); };
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
};
const clone = o => JSON.parse(JSON.stringify(o));
const heDate = (d, o) => new Date(d).toLocaleDateString('he-IL', o);

/* ================= profile & gender ================= */
let SET = Object.assign({ name: '', age: '', gender: '', coachName: '', phone: '', email: '', shName: '', shPhone: '', goal: 3, voice: true, voiceURI: '', rate: 0.95 }, store.get('rc_set', {}));
const saveSet = () => store.set('rc_set', SET);
// בחירת נוסח לפי מגדר: זכר / נקבה / ניטרלי
const t = (m, f, n) => SET.gender === 'm' ? m : SET.gender === 'f' ? f : n;
const nmS = () => SET.name ? ' ' + SET.name : '';

/* ================= plan ================= */
const DEFAULT = { warmup: 5, cooldown: 10, blocks: [{ run: 60, walk: 120, reps: 6 }] };
function cleanPlan(p) {
  p = p || {};
  const n = (v, a, b, d) => { v = +v; return isFinite(v) ? Math.min(b, Math.max(a, v)) : d; };
  const bl = (Array.isArray(p.blocks) ? p.blocks : []).slice(0, 20).map(b => ({ run: Math.round(n(b.run, 5, 7200, 60)), walk: Math.round(n(b.walk, 0, 3600, 60)), reps: Math.round(n(b.reps, 1, 100, 1)) }));
  return { warmup: n(p.warmup, 0, 60, 5), cooldown: n(p.cooldown, 0, 60, 10), blocks: bl.length ? bl : clone(DEFAULT.blocks) };
}
let plan = cleanPlan(store.get('rc_plan', DEFAULT));
const savePlan = () => store.set('rc_plan', plan);
let assigned = null; // אימון שנשלח בקישור: { plan, coach }
const hist = () => store.get('rc_hist', []);
const saveHist = h => {
  h = h.slice(-200); h.forEach((r, i) => { if (r.track && i < h.length - 30) delete r.track; });
  if (!store.set('rc_hist', h)) { h.forEach((r, i) => { if (i < h.length - 3) delete r.track; }); store.set('rc_hist', h); }
};

const pad2 = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const fromYmd = x => { const [a, b, c] = x.split('-').map(Number); return new Date(a, b - 1, c); };
const todayStr = () => ymd(new Date());
const SCH = () => store.get('rc_sched', []);
const saveSch = a => store.set('rc_sched', a);
const appUrl = () => location.protocol === 'file:' ? location.href.split('#')[0] : location.origin + location.pathname;

function buildSteps(p) {
  const s = [];
  if (p.warmup > 0) s.push({ kind: 'warmup', dur: p.warmup * 60 });
  p.blocks.forEach(b => { for (let r = 1; r <= b.reps; r++) {
    s.push({ kind: 'run', dur: b.run, rep: r, reps: b.reps });
    s.push({ kind: 'walk', dur: b.walk, rep: r, reps: b.reps });
  } });
  for (let i = s.length - 1; i >= 0; i--) { if (s[i].kind === 'walk') { s.splice(i, 1); break; } if (s[i].kind === 'run') break; }
  if (p.cooldown > 0) s.push({ kind: 'cooldown', dur: p.cooldown * 60 });
  return s.filter(x => x.dur > 0);
}
const totalSec = p => buildSteps(p).reduce((a, s) => a + s.dur, 0);
const describe = p => p.blocks.map(b => `${b.reps > 1 ? b.reps + ' × ' : ''}ריצה ${fmt(b.run)}${b.walk ? ' + הליכה ' + fmt(b.walk) : ''}`).join(' · ');
const PH = { run: ['🏃', 'ריצה'], walk: ['🚶', 'הליכה'], warmup: ['🔥', 'חימום'], cooldown: ['🧘', 'שחרור'] };
const stepLabel = s => s.kind === 'run' ? `ריצה ${s.rep}/${s.reps}` : s.kind === 'walk' ? `הליכה ${s.rep}/${s.reps}` : PH[s.kind][1];
// אחוז ביצוע = זמן שבוצע בפועל מתוך זמן האימון המתוכנן
function completion(rec) {
  if (!rec.plan) return null;
  const planned = totalSec(cleanPlan(rec.plan)); if (!planned) return null;
  const pct = Math.round(rec.steps.reduce((a, x) => a + x.sec, 0) / planned * 100);
  const [label, cls] = pct <= 20 ? ['לא בוצע', 'b-none'] : pct < 80 ? ['בוצע חלקית', 'b-part'] : pct <= 120 ? ['בוצע', 'b-done'] : ['מעל התכנון', 'b-over'];
  return { pct, label, cls };
}
const badge = rec => { const c = completion(rec); return c ? `<span class="badge ${c.cls}">${c.label} · ${c.pct}%</span>` : ''; };
function stats(rec) {
  const runs = rec.steps.filter(s => s.kind === 'run'), sum = (a, f) => a.reduce((x, s) => x + s[f], 0);
  return { sec: sum(rec.steps, 'sec'), m: sum(rec.steps, 'distM'), runSec: sum(runs, 'sec'), runM: sum(runs, 'distM') };
}
const planList = p => `<ul class="plan">
  ${p.warmup > 0 ? `<li><span class="dot d-warmup"></span>חימום · הליכה מהירה · ${p.warmup} דק׳</li>` : ''}
  ${p.blocks.map(b => `<li><span class="dot d-run"></span><span>${b.reps > 1 ? '<b>' + b.reps + ' חזרות:</b> ' : ''}ריצה ${fmt(b.run)}${b.walk ? ' + הליכה ' + fmt(b.walk) : ''}</span></li>`).join('')}
  ${p.cooldown > 0 ? `<li><span class="dot d-cooldown"></span>שחרור · הליכה רגועה · ${p.cooldown} דק׳</li>` : ''}</ul>`;

/* ================= shell / navigation ================= */
let tab = 'train', flash = '';
function plain(html, keep) { const y = window.scrollY; app.innerHTML = `<main style="padding-bottom:32px">${html}</main>`; window.scrollTo(0, keep ? y : 0); }
function shell(active, html, keepScroll) {
  const y = window.scrollY;
  app.innerHTML = `<main>${html}</main><nav class="tabs" aria-label="ניווט ראשי">${[['train', '🏃', 'אימון'], ['cal', '🗓', 'לוח'], ['log', '📒', 'יומן'], ['stats', '📈', 'התקדמות']]
    .map(([k, i, tx]) => `<button data-tab="${k}" ${active === k ? 'aria-current="page"' : ''}><span>${i}</span>${tx}</button>`).join('')}</nav>`;
  app.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => go(b.dataset.tab));
  window.scrollTo(0, keepScroll ? y : 0);
}
function go(x) { tab = x; ({ train: renderTrain, cal: renderCal, log: renderLog, stats: renderStats })[x](); }

/* ================= screen 1: profile ================= */
function renderProfile(edit) {
  let g = SET.gender || '';
  const vOpts = VOICES.length ? VOICES.map(v => `<option value="${esc(v.voiceURI)}" ${pickVoice() === v ? 'selected' : ''}>${esc(v.name)}</option>`).join('') : '<option>קול ברירת המחדל של המכשיר</option>';
  plain(`<header class="hero"><div class="kick">${edit ? 'עריכת פרטים' : 'ברוכים הבאים'}</div><h1>${edit ? 'הפרטים והקול' : 'בואו נכיר'}</h1>
    <p>כמה פרטים קטנים, כדי שנוכל לעודד אתכם אישית ובלשון הנכונה.</p></header>
  <div class="card">
    <label for="nm">איך קוראים לך?</label><input id="nm" value="${esc(SET.name)}" autocomplete="given-name" maxlength="30">
    <label for="ag">גיל</label><input id="ag" type="number" inputmode="numeric" min="5" max="99" value="${esc(SET.age)}">
    <div class="lbl" id="gl">איך לפנות אליך?</div>
    <div class="seg" role="group" aria-labelledby="gl">${[['m', 'זכר'], ['f', 'נקבה'], ['n', 'אחר']].map(([k, l]) => `<button data-g="${k}" aria-pressed="${g === k}">${l}</button>`).join('')}</div>
    <p class="mut" style="margin-top:8px">העידוד והסיכומים ינוסחו בהתאם. הפרטים נשמרים רק במכשיר הזה.</p>
    <p class="err" id="er" role="alert"></p></div>
  ${edit ? `<div class="card"><h2>🔊 קול ההנחיה</h2>

const SEG_COLOR = { run: '#ff6b2c', walk: '#22b8f0', warmup: '#f5b83d', cooldown: '#a78bfa' };

  try {

      (layers[g.i] = layers[g.i] || []).push(L.polyline(g.pts, { color: SEG_COLOR[kind], weight: 6, opacity: .95, lineCap: 'round', lineJoin: 'round' }).addTo(map));

    L.circleMarker(all[all.length - 1], { radius: 8, color: '#fff', weight: 3, fillColor: '#ef4444', fillOpacity: 1 }).addTo(map);

  const X = o => 25 + (o - minO) * k * sc + (250 - w * sc) / 2, Y = a => 25 + (maxA - a) * sc + (250 - h * sc) / 2;
  return `<svg viewBox="0 0 300 300" style="width:100%;height:100%" role="img" aria-label="המסלול">${segs.map(g =>
    `<polyline fill="none" stroke="${SEG_COLOR[(rec.steps[g.i] || {}).kind || 'run']}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" points="${g.pts.map(q => X(q[1]).toFixed(1) + ',' + Y(q[0]).toFixed(1)).join(' ')}"/>`).join('')}</svg>`;
}
function tcx(rec) {
  const iso = ms => new Date(ms).toISOString(), x = v => String(v).replace(/[<>&"']/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;', "'": '&apos;' }[c]));
  let t = new Date(rec.date).getTime() - rec.steps.reduce((a, s) => a + s.sec, 0) * 1000, cum = 0, firstStart = null;
  const laps = [];
  rec.steps.forEach((s, i) => {
    const st = s.t0 ? s.t0 * 1000 : t; t = st + s.sec * 1000;
    if (s.sec < 1) return;
    if (firstStart === null) firstStart = st;
    const pts = (rec.track || []).filter(q => q[3] === i);
    let len = 0; for (let j = 1; j < pts.length; j++) len += hav(pts[j - 1][0], pts[j - 1][1], pts[j][0], pts[j][1]);
    const sc = len > 0 && s.distM > 0 ? s.distM / len : 1;
    let run = 0;
    const tp = pts.map((q, j) => { if (j) run += hav(pts[j - 1][0], pts[j - 1][1], q[0], q[1]) * sc;
      return `<Trackpoint><Time>${iso(q[2] * 1000)}</Time><Position><LatitudeDegrees>${q[0]}</LatitudeDegrees><LongitudeDegrees>${q[1]}</LongitudeDegrees></Position><DistanceMeters>${(cum + run).toFixed(1)}</DistanceMeters></Trackpoint>`; }).join('');
    laps.push(`<Lap StartTime="${iso(st)}"><TotalTimeSeconds>${s.sec}</TotalTimeSeconds><DistanceMeters>${s.distM}</DistanceMeters><Calories>0</Calories><Intensity>${s.kind === 'walk' ? 'Resting' : 'Active'}</Intensity><TriggerMethod>Manual</TriggerMethod>${tp ? `<Track>${tp}</Track>` : ''}</Lap>`);
    cum += s.distM;
  });
  return `<?xml version="1.0" encoding="UTF-8"?>\n<TrainingCenterDatabase xmlns="http://www.garmin.com/xmlschemas/TrainingCenterDatabase/v2" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://www.garmin.com/xmlschemas/TrainingCenterDatabase/v2 http://www.garmin.com/xmlschemas/TrainingCenterDatabasev2.xsd"><Activities><Activity Sport="Running"><Id>${iso(firstStart ?? Date.now())}</Id>${laps.join('')}<Notes>${x(rec.title)}</Notes></Activity></Activities></TrainingCenterDatabase>`;
}
async function exportTcx(rec, share) {
  const xml = tcx(rec), d = new Date(rec.date), pd = n => String(n).padStart(2, '0'), msg = $('#tcxm');
  const name = `run-${d.getFullYear()}-${pd(d.getMonth() + 1)}-${pd(d.getDate())}-${pd(d.getHours())}${pd(d.getMinutes())}.tcx`;
  if (share) {
    try { const f = new File([xml], name, { type: 'application/vnd.garmin.tcx+xml' });
      if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: 'אימון ריצה' }); return; } } catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([xml], { type: 'application/xml' })); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000); if (msg) msg.textContent = 'הקובץ נשמר במכשיר ✓ עכשיו פותחים את TrainingPeaks ומעלים אותו.';
}

/* ================= tab: log ================= */
function renderLog() {
  const h = hist().slice().reverse().slice(0, 40);
  shell('log', `<header class="hero"><div class="kick">היסטוריה</div><h1>יומן אימונים</h1><p>${h.length ? 'האימונים האחרונים. לחיצה פותחת את הפרטים.' : 'כאן יופיעו האימונים שלכם.'}</p></header>
  ${h.length ? h.map(r => { const s = stats(r); return `<button class="log" data-id="${r.id}"><b>${heDate(r.date, { weekday: 'long', day: 'numeric', month: 'long' })}</b>
    <span class="m">${esc(r.title)}${r.track ? ' · 🗺' : ''}</span><div class="m">⏱ ${fmtH(s.sec)} · <span class="k">${km2(s.m)} ק״מ</span> · ⚡ ${pace(s.runSec, s.runM)} /ק״מ</div>${badge(r) ? '<div style="margin-top:8px">' + badge(r) + '</div>' : ''}</button>`; }).join('')
    : '<div class="card" style="text-align:center"><div class="big">👟</div><p>עוד אין אימונים. בואו נתחיל!</p><button id="start">לבניית אימון</button></div>'}`);
  app.querySelectorAll('[data-id]').forEach(b => b.onclick = () => renderSummary(hist().find(r => r.id === +b.dataset.id), 'log'));
  if ($('#start')) $('#start').onclick = () => go('train');
}

/* ================= tab: progress ================= */
let sMode = 'week', sOff = 0;
function range(mode, off) {
  const n = new Date();
  if (mode === 'week') { const s = new Date(n.getFullYear(), n.getMonth(), n.getDate() - n.getDay() + 7 * off), e = new Date(s); e.setDate(e.getDate() + 7); return [s, e]; }
  const s = new Date(n.getFullYear(), n.getMonth() + off, 1); return [s, new Date(s.getFullYear(), s.getMonth() + 1, 1)];
}
const inRange = (s, e) => hist().filter(r => { const d = new Date(r.date); return d >= s && d < e; });
function agg(rs) {
  const a = { n: rs.length, m: 0, sec: 0, runSec: 0, runM: 0 };
  rs.forEach(r => { const s = stats(r); a.m += s.m; a.sec += s.sec; a.runSec += s.runSec; a.runM += s.runM; });
  a.pace = paceSec(a.runSec, a.runM); return a;
}
function bars(mode, rs, s) {
  if (mode === 'week') { const b = Array.from({ length: 7 }, (_, i) => ({ l: 'אבגדהוש'[i], v: 0 })); rs.forEach(r => { b[new Date(r.date).getDay()].v += stats(r).m / 1000; }); return b; }
  const days = new Date(s.getFullYear(), s.getMonth() + 1, 0).getDate(), n = Math.ceil(days / 7);
  const b = Array.from({ length: n }, (_, i) => ({ l: 'שבוע ' + (i + 1), v: 0 })); rs.forEach(r => { b[Math.floor((new Date(r.date).getDate() - 1) / 7)].v += stats(r).m / 1000; }); return b;
}
function feedback(mode, cur, prev, off) {
  const out = [], per = mode === 'week' ? 'השבוע' : 'החודש', prevT = mode === 'week' ? 'שבוע שעבר' : 'חודש שעבר', n = SET.name ? SET.name + ', ' : '';
  if (!cur.n) return [off === 0 ? `${n}עוד לא היו אימונים ${per}. אפילו 20 דקות של ריצה והליכה הן התחלה מצוינת 💪` : 'לא היו אימונים בתקופה הזו.'];
  if (mode === 'week') out.push(cur.n >= SET.goal ? `🏆 ${n}היעד הושג: ${cnt(cur.n)} מתוך ${SET.goal}! ${t('אתה אלוף', 'את אלופה', 'אלופים')}!` : off === 0 ? `🎯 ${n}${cnt(cur.n)} מתוך יעד ${SET.goal}. נשארו עוד ${SET.goal - cur.n} להשלמת היעד.` : `${cnt(cur.n)} מתוך יעד ${SET.goal}.`);
  else out.push(`🗓 ${n}${cnt(cur.n)} ${per}. ${t('כל הכבוד על העקביות', 'כל הכבוד על העקביות', 'כל הכבוד על העקביות')}!`);
  if (prev.m > 0) {
    const pct = Math.round((cur.m - prev.m) / prev.m * 100);
    if (pct >= 30) out.push(`📈 קפיצה של ${pct}% במרחק לעומת ${prevT}. כל הכבוד, אבל כדאי לא להעלות יותר מכ-10%-20% בכל פעם, כדי לתת לגוף להתרגל.`);
    else if (pct >= 5) out.push(`📈 עלייה של ${pct}% במרחק לעומת ${prevT}. התקדמות יפה!`);
    else if (pct <= -20) out.push(`📉 ירידה של ${Math.abs(pct)}% במרחק לעומת ${prevT}. זה קורה, העיקר לחזור לשגרה.`);
    else out.push(`➖ מרחק יציב לעומת ${prevT}. עקביות היא הבסיס.`);
  } else if (cur.m > 0) out.push(`🚀 ${km2(cur.m)} ק״מ ${per}. זו נקודת הפתיחה להשוואה בהמשך.`);
  if (cur.pace && prev.pace) {
    const d = Math.round(prev.pace - cur.pace);
    if (d >= 5) out.push(`⚡ קצב הריצה השתפר ב-${d} שניות לק״מ.`);
    else if (d <= -10) out.push(`🐢 הקצב איטי ב-${-d} שניות לק״מ. ייתכן שהגוף עייף, ומותר לנוח.`);
    else out.push('⚡ קצב הריצה יציב.');
  }
  return out;
}
const cnt = n => n === 1 ? 'אימון אחד' : n + ' אימונים';
const dl = (c, p, inv, unit = '%') => { if (!p) return '<small>&nbsp;</small>'; const d = unit === '%' ? Math.round((c - p) / p * 100) : Math.round(c - p); if (!d) return '<small>&nbsp;</small>'; const good = inv ? d < 0 : d > 0; return `<small class="${good ? 'up' : 'down'}">${d > 0 ? '▲' : '▼'} ${Math.abs(d)}${unit === '%' ? '%' : ' שנ׳'}</small>`; };
function renderStats() {
  const [s, e] = range(sMode, sOff), [ps, pe] = range(sMode, sOff - 1);
  const rs = inRange(s, e), cur = agg(rs), prev = agg(inRange(ps, pe));
  const label = sMode === 'week' ? `${heDate(s, { day: 'numeric', month: 'short' })} – ${heDate(new Date(e - 864e5), { day: 'numeric', month: 'short' })}` : heDate(s, { month: 'long', year: 'numeric' });
  const b = bars(sMode, rs, s), mx = Math.max(...b.map(x => x.v));
  shell('stats', `<header class="hero"><div class="kick">ההתקדמות שלי</div><h1>סיכום ${sMode === 'week' ? 'שבועי' : 'חודשי'}</h1></header>
  <div class="seg" role="group" aria-label="תקופה"><button data-m="week" aria-pressed="${sMode === 'week'}">שבועי</button><button data-m="month" aria-pressed="${sMode === 'month'}">חודשי</button></div>
  <div class="nav"><button id="pv" aria-label="תקופה קודמת">›</button><b>${label}</b><button id="nx" aria-label="תקופה הבאה" ${sOff >= 0 ? 'disabled' : ''}>‹</button></div>
  <div class="tiles">
    <div class="tile"><b>${cur.n}</b><span>אימונים</span>${dl(cur.n, prev.n)}</div>
    <div class="tile"><b>${km2(cur.m)}</b><span>ק״מ</span>${dl(cur.m, prev.m)}</div>
    <div class="tile"><b>${fmtH(cur.sec)}</b><span>זמן כולל</span>${dl(cur.sec, prev.sec)}</div>
    <div class="tile"><b>${cur.pace ? fmt(cur.pace) : '—'}</b><span>קצב ריצה ממוצע /ק״מ</span>${cur.pace && prev.pace ? dl(cur.pace, prev.pace, true, 's') : '<small>&nbsp;</small>'}</div></div>
  <div class="card"><h2>ק״מ ${sMode === 'week' ? 'לפי יום' : 'לפי שבוע'}</h2><div class="bars" role="img" aria-label="גרף ק״מ">
    ${b.map(x => `<div class="bar-c"><span class="bv">${x.v ? x.v.toFixed(1) : ''}</span><div class="bf ${x.v ? '' : 'z'}" style="height:${x.v ? Math.max(4, x.v / mx * 100) : 2}%"></div><span class="bl">${x.l}</span></div>`).join('')}</div></div>
  <div class="card"><h2>💬 פידבק</h2><ul class="fb">${feedback(sMode, cur, prev, sOff).map(x => `<li>${x}</li>`).join('')}</ul></div>
  ${sMode === 'week' ? `<div class="card"><h2>🎯 יעד שבועי</h2><div class="stp"><div class="stp-l">אימונים בשבוע</div><div class="stp-c"><button id="gm" aria-label="פחות">−</button><output>${SET.goal}</output><button id="gp" aria-label="יותר">+</button></div></div></div>` : ''}
  ${coachCard('sendw')}`);
  app.querySelectorAll('[data-m]').forEach(x => x.onclick = () => { sMode = x.dataset.m; sOff = 0; renderStats(); });
  $('#pv').onclick = () => { sOff--; renderStats(); };
  $('#nx').onclick = () => { if (sOff < 0) { sOff++; renderStats(); } };
  if ($('#gm')) { $('#gm').onclick = () => { SET.goal = Math.max(1, SET.goal - 1); saveSet(); renderStats(); }; $('#gp').onclick = () => { SET.goal = Math.min(14, SET.goal + 1); saveSet(); renderStats(); }; }
  const r = bindSend('sendw', () => [`📊 סיכום ${sMode === 'week' ? 'שבועי' : 'חודשי'}${SET.name ? ' - ' + SET.name : ''}${SET.age ? ', גיל ' + SET.age : ''}`, label, '',
    `🏃 אימונים: ${cur.n}`, `📏 מרחק: ${km2(cur.m)} ק״מ`, `⏱ זמן כולל: ${fmtH(cur.sec)}`, `⚡ קצב ריצה ממוצע: ${cur.pace ? fmt(cur.pace) : '—'} /ק״מ`, '',
    ...feedback(sMode, cur, prev, sOff)].join('\n'), 'סיכום ' + (sMode === 'week' ? 'שבועי' : 'חודשי'), true);
  bindCoach(r);
}

/* ================= start ================= */
function boot() {
  const m = location.hash.match(/w=([\w-]+)/);
  if (m) {
    try {
      const o = dec(m[1]), coach = o.c && (o.c.p || o.c.n) ? { n: String(o.c.n || '').slice(0, 60), p: String(o.c.p || '').slice(0, 20) } : null, note = String(o.m || '').slice(0, 140);
      if (o.s) assignedSched = parseSched(o, coach, note); else assigned = { plan: cleanPlan(o.p || o), coach, note };
    } catch (e) {}
    history.replaceState(null, '', location.pathname + location.search);
  }
  if (!SET.name) return renderProfile(false);
  if (assignedSched) return renderSchedImport();
  if (assigned) return renderAssigned();
  go('train');
}
boot();
window.addEventListener('hashchange', () => { if (!S && /w=/.test(location.hash)) boot(); });
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
